name: Run Pytest Unit Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.py"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.py"
      - ".github/workflows/**"

# Section 4 Advanced Feature:
# Cancels obsolete in-flight workflow runs when rapid commits are pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short